services:
  proxy:
    image: 'nginx:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx-data/:/data
      - ./certs/:/etc/nginx/certs/
      - ./build_templates.sh:/build_templates.sh
  vaultwarden:
    image: vaultwarden/server:latest
    ports:
      - '8218:80'
    volumes:
      - ./vw-data:/data
    environment:
      DOMAIN: 'https://vw.localhost'
      SIGNUPS_ALLOWED: "true"
